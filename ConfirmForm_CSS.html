<style type="text/css">
    body { font-family: 'Segoe UI', Inter, Tahoma, sans-serif; background-color: #fbfaf9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 480px; margin: 20px auto; background: white; padding: 30px 25px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); border: 1px solid #f0f0f0; }
    h2 { text-align: center; color: #691d27; font-size: 20px; font-weight: bold; margin-top: 0; }
    p.subtitle { text-align: center; font-size: 14px; color: #888; margin-bottom: 25px; }
    
    input, select, button, .checkbox-container { transition: all 0.2s ease; }
    
    .notice-box { background-color: #fbfaf9; border-left: 3px solid #d4af37; padding: 15px; margin-bottom: 25px; border-radius: 4px; font-size: 13px; color: #666; line-height: 1.6; }
    .notice-box strong { color: #691d27; }

    .search-box input { width: 100%; padding: 14px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 15px; box-sizing: border-box; background: #fafafa; }
    .search-box input:focus { outline: none; border-color: #691d27; background: #fff; box-shadow: 0 0 0 3px rgba(105, 29, 39, 0.05); }
    select { width: 100%; padding: 14px; margin-top: 10px; border-radius: 6px; border: 1px solid #e0e0e0; font-size: 14px; box-sizing: border-box; background-color: #fff; cursor: pointer; }
    select:focus { outline: none; border-color: #691d27; }
    
    .card { border-top: 1px solid #f0f0f0; padding-top: 25px; margin-top: 25px; display: none; }
    .card h3 { margin: 0 0 15px 0; color: #691d27; font-size: 16px; font-weight: bold; }
    
    .info-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; border-bottom: 1px solid #f8f8f8; padding-bottom: 6px; }
    .info-label { color: #888; font-weight: bold; }
    .info-val { color: #222; font-weight: 500; text-align: right; }
    
    .pickup-highlight { background-color: #691d27; color: white; padding: 25px 20px; border-radius: 8px; margin-top: 25px; text-align: center; box-shadow: 0 8px 20px rgba(105, 29, 39, 0.15); }
    .pickup-highlight div { font-size: 14px; font-weight: bold; opacity: 0.9; }
    .pickup-highlight .time { font-size: 32px; margin-top: 8px; font-weight: bold; }
    
    .checkbox-container { display: flex; align-items: flex-start; margin-top: 25px; font-size: 15px; background: #fbfaf9; padding: 15px; border-radius: 6px; border-left: 4px solid #691d27; cursor: pointer; }
    .checkbox-container:hover { border-color: #50151d; background: #fff; }
    .checkbox-container input { width: 20px; height: 20px; margin-right: 12px; cursor: pointer; accent-color: #691d27; margin-top: 2px; }
    .checkbox-text strong { color: #333; font-size: 15px; font-weight: bold; }
    
    .btn-confirm { width: 100%; padding: 16px; background-color: #691d27; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(105, 29, 39, 0.2); }
    .btn-confirm:hover { background-color: #50151d; transform: translateY(-1px); }
    .btn-confirm:disabled { background-color: #e0e0e0; color: #a0a0a0; cursor: not-allowed; box-shadow: none; transform: none; }
    #statusMsg { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; color: #888; }
</style>
