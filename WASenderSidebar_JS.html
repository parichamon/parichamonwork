<script>
   // ==========================================
   // เพิ่มฟังก์ชันป้องกัน XSS
   // ==========================================
   function escapeHtml(str) {
     if (str === null || str === undefined) return '';
     return String(str)
       .replace(/&/g, '&amp;')
       .replace(/</g, '&lt;')
       .replace(/>/g, '&gt;')
       .replace(/"/g, '&quot;')
       .replace(/'/g, '&#39;');
   }

   function loadWaData() {
        try {
            // แสดง Loading ตอนดึงข้อมูล
            document.getElementById('statusCount').innerText = "Loading...";
            
            google.script.run.withSuccessHandler(renderList)
           .withFailureHandler(function(err) {
                // ครอบ escapeHtml ป้องกัน XSS จากข้อความ Error
                document.getElementById('loading').innerHTML = `Error: ${escapeHtml(err.message)}`;
                document.getElementById('statusCount').innerText = "Failed";
            }).getGuestListForWA();
        } catch (e) {
            document.getElementById('loading').innerHTML = `Error: ${escapeHtml(e.message)}`;
        }
   }
   
   function renderList(records) {
     const container = document.getElementById('listContainer');
     const statusEl = document.getElementById('statusCount');
     
     if (!records) { 
         statusEl.innerText = "Error"; 
         container.innerHTML = ""; 
         return; 
     }
     
     statusEl.innerText = `Found ${records.length}`;
     if(records.length === 0) {
          container.innerHTML = '<div style="text-align:center; font-size:12px; color:#888; padding-top:10px;">No pending items.</div>';
          return;
      }
      
     // ล้างค่าเก่า
     container.innerHTML = "";
     
     records.forEach((guest, index) => {
       try {
         let rawPhone = String(guest.PhoneNo || '').trim().replace(/[\(\)\-\s]/g, '');
         let phone = '';
         if (rawPhone.startsWith('+')) { phone = rawPhone.replace(/\D/g, ''); } 
         else if (rawPhone.startsWith('00')) { phone = rawPhone.substring(2).replace(/\D/g, ''); } 
         else { phone = rawPhone.replace(/\D/g, ''); if (phone.startsWith('0') && phone.length === 10) { phone = '66' + phone.substring(1); } }
         
         let displayName = String(guest.Name || 'Unknown');
         let roomNo = String(guest.RoomNo || '-');
         let uuid = String(guest.uuid || '');

         // --- แก้บั๊ก XSS: ใช้ DOM Element แทน innerHTML ป้องกัน String Injection 100% ---
         const card = document.createElement('div');
         card.className = `guest-card ${guest.isSent ? "sent" : ""}`;
         card.id = `card-${index}`;

         const infoDiv = document.createElement('div');
         infoDiv.className = 'guest-info';

         const nameDiv = document.createElement('div');
         nameDiv.className = 'guest-name';
         nameDiv.textContent = displayName; // textContent ป้องกัน HTML Injection อัตโนมัติ

         const phoneDiv = document.createElement('div');
         phoneDiv.className = 'guest-phone';
         phoneDiv.textContent = `Room: ${roomNo} | +${phone}`;

         infoDiv.appendChild(nameDiv);
         infoDiv.appendChild(phoneDiv);

         const btn = document.createElement('button');
         btn.className = 'btn-send';
         btn.textContent = guest.isSent ? "Done" : "Send";
         
         // ผูก Event Listener โดยตรง ไม่ต้องกังวลเรื่อง Escape Quote ใดๆ
         btn.addEventListener('click', function() {
           sendWA(uuid, phone, displayName);
         });

         card.appendChild(infoDiv);
         card.appendChild(btn);
         container.appendChild(card);
       } catch (e) {
           console.error(e);
       }
     });
   }

  function sendWA(uuid, phone, guestName) {
    // --- แก้บั๊ก Template: ดึงข้อความจาก Textarea ในหน้า UI กลับมาใช้ ---
    let templateEl = document.getElementById('msgTemplate');
    let message = templateEl ? templateEl.value : "Hello {name}, this is a message regarding your transportation.";
    
    // แทนที่ตัวแปร {name} ด้วยชื่อแขกจริงๆ
    message = message.replace(/{name}/g, guestName);

    // แสดงสถานะโหลดบนหน้าต่าง WA เพื่อให้สตาฟฟ์รู้ว่ากำลังเซฟ
    const statusEl = document.getElementById('statusCount');
    if (statusEl) statusEl.innerText = "Saving status...";

    // สั่งอัปเดตสถานะไปที่เซิร์ฟเวอร์ + ดัก Error 
    google.script.run
      .withSuccessHandler(function() {
        loadWaData(); 
      })
      .withFailureHandler(function(err) {
        // ถ้าระบบหลังบ้านพัง (เช่น เน็ตหลุด หรือชีตพัง) จะเด้งเตือนสตาฟฟ์ทันที
        alert("⚠️ Warning: Message opened, but failed to save 'Sent' status.\nError: " + err.message);
        loadWaData();
      })
      .markWASent(uuid);

    // เปิดหน้าต่าง WhatsApp ส่งข้อความ
    let waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    window.open(waUrl, '_blank');
  }
</script>
