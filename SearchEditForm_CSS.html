<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #fbfaf9; margin: 0; color: #333; }
  .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
  
  input, select, button { transition: all 0.25s ease-in-out; font-family: inherit; }
  
  #searchKey { flex: 1; padding: 12px 16px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
  #searchKey:focus { outline: none; border-color: #691d27; box-shadow: 0 0 0 3px rgba(105, 29, 39, 0.1); }
  
  .btn-add { padding: 0 20px; background: #691d27; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap; font-size: 14px; box-shadow: 0 2px 5px rgba(105, 29, 39, 0.2); }
  .btn-add:hover { background: #50151d; transform: translateY(-1px); box-shadow: 0 4px 8px rgba(105, 29, 39, 0.3); }
  
  select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #e0e0e0; font-size: 14px; cursor: pointer; background: #fff; }
  select:focus { outline: none; border-color: #691d27; }
  
  .form-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #f0f0f0; display: none; }
  .row { display: flex; gap: 15px; margin-bottom: 12px; }
  .col { flex: 1; }
  label { display: block; font-size: 12px; font-weight: bold; color: #666; margin-bottom: 6px; letter-spacing: 0.02em; }
  
  input[type="text"], input[type="date"], select.status-select { 
    width: 100%; padding: 10px 12px; box-sizing: border-box; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px; background: #fafafa;
  }
  input[type="text"]:focus, input[type="date"]:focus, select.status-select:focus { border-color: #691d27; outline: none; background: #fff; }
  
  select.status-select { padding: 10px 12px; margin-bottom: 0; } 
  
  .btn-save { width: 100%; padding: 14px; background: #4a6b53; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 20px; font-weight: bold; box-shadow: 0 2px 5px rgba(74, 107, 83, 0.2); }
  .btn-save:hover { background: #3b5742; transform: translateY(-1px); box-shadow: 0 4px 8px rgba(74, 107, 83, 0.3); }
  .btn-save:disabled { background: #dcdcdc; cursor: not-allowed; transform: none; box-shadow: none; color: #888; }
  
  .btn-delete { width: 100%; padding: 14px; background: #fff; color: #8b0000; border: 1px solid #8b0000; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 10px; font-weight: bold; }
  .btn-delete:hover { background: #fff5f5; transform: translateY(-1px); box-shadow: 0 4px 8px rgba(139, 0, 0, 0.1); }
  .btn-delete:disabled { border-color: #dcdcdc; color: #dcdcdc; cursor: not-allowed; transform: none; box-shadow: none; }
  
  #status { text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 13px; color: #691d27; }
  .sec-title { font-size: 14px; font-weight: bold; color: #691d27; margin-top: 25px; margin-bottom: 12px; border-bottom: 1px solid #f0f0f0; padding-bottom: 6px; letter-spacing: 0.02em; }
  
  @media (max-width: 480px) {
    .row { flex-direction: column; gap: 10px; }
    .col { flex: none; width: 100%; }
  }
</style>
